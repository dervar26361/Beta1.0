@media (max-width:560px){.hero .bigbtn{align-self:stretch;padding:16px 24px}}
.ldesc{max-width:70ch;margin:.6rem 0 1rem}.ldesc h2{margin:.2rem 0 .3rem}.ldesc p{line-height:1.55;margin:0}
#dani{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:calc(100vw - 24px)}
.dfab{width:58px;height:58px;border-radius:50%;border:3px solid var(--ac);background:var(--card);padding:0;cursor:pointer;box-shadow:var(--sh);overflow:hidden}.dfab svg,.dav svg{width:100%;height:100%;display:block}
.dtease{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px 16px 16px 4px;padding:10px 30px 10px 14px;box-shadow:var(--sh);position:relative;order:-1;cursor:pointer;font-weight:600;animation:dpop .35s ease-out}
@keyframes dpop{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}
.dx{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--mu);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
.dpanel{width:min(360px,calc(100vw - 24px));max-height:min(75vh,560px);display:flex;flex-direction:column;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.dhead{display:flex;gap:10px;align-items:center;padding:10px 40px 10px 12px;border-bottom:2px solid var(--ac);position:relative;background:var(--card2)}.dhead .dx{top:10px}
.dav{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:0 0 auto;display:block}
.dbody{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.dm{max-width:88%;padding:8px 12px;border-radius:14px;font-size:14px}.dm.bot{background:var(--card2);border:1px solid var(--bd);align-self:flex-start;border-bottom-left-radius:4px}.dm.usr{background:var(--ac);color:var(--on);align-self:flex-end;border-bottom-right-radius:4px}
.dopts{display:flex;flex-wrap:wrap;gap:6px}
.dtag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--on);background:var(--ac);border-radius:99px;padding:2px 10px;margin-bottom:4px}
.dani-set{margin:12px 0}
#dani .dpanel,#dani .dtease{background:#0b1220;color:#e4eaf3;border-color:#2c3b52}#dani .dhead{background:#0d1523}#dani .dm.bot{background:#16202f;color:#e4eaf3;border-color:#2c3b52}#dani .chip{background:#16202f;color:#e4eaf3;border-color:#2c3b52}#dani .chip:hover{border-color:#6fa8ff}#dani .m,#dani .dx{color:#9aabc2}#dani .dm.usr{background:#6fa8ff;color:#0a1220}
a.row.sim.dn,a.row.sim.up{color:var(--tx)!important}@media (max-width:760px){nav{overflow-x:auto;min-width:0}nav a{flex:0 0 auto!important;min-width:76px}.wrap>*{min-width:0}}</style>
